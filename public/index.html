<script>

function tab(type){

 document.getElementById("login")
   .classList.toggle("hide",type!="login");

 document.getElementById("register")
   .classList.toggle("hide",type!="register");

 document.getElementById("lt")
   .classList.toggle("active",type=="login");

 document.getElementById("rt")
   .classList.toggle("active",type=="register");

 msg("");
}

function msg(text){
 document.getElementById("msg").innerText=text;
}

async function login(){

 const username=document.getElementById("user").value.trim();
 const password=document.getElementById("pass").value;

 if(!username||!password){
  msg("Username and password required");
  return;
 }

 try{

  const res=await fetch("/api/login",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   credentials:"include",
   body:JSON.stringify({username,password})
  });

  const data=await res.json();

  if(!res.ok){
   msg(data.message||data.error||"Login failed");
   return;
  }

  location.reload();

 }catch(e){
  msg("Server connection failed");
 }

}

async function register(){

 const username=document.getElementById("ruser").value.trim();
 const email=document.getElementById("remail").value.trim();
 const mobile=document.getElementById("rmobile").value.trim();
 const password=document.getElementById("rpass").value;
 const confirm=document.getElementById("rconfirm").value;

 if(!username||!email||!mobile||!password){
  msg("All fields are required");
  return;
 }

 if(password!==confirm){
  msg("Passwords do not match");
  return;
 }

 try{

  const res=await fetch("/api/register",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({
    username,
    email,
    mobile,
    password
   })
  });

  const data=await res.json();

  if(!res.ok){
   msg(data.message||data.error||"Registration failed");
   return;
  }

  msg("Account created! Please login.");
  tab("login");

 }catch(e){
  msg("Server connection failed");
 }

}

function renderPrices(){

  const box = document.getElementById("priceManager");

  box.innerHTML = products.map((p,i) => `

    <div class="admin-product-card">

      <h3>${p.name}</h3>

      ${p.prices.map((x,j) => `
        <div class="price-row">

          <span>${x[0]}</span>

          <input
            type="number"
            value="${x[1]}"
            id="price-${i}-${j}"
          >

          <button onclick="savePrice(${i},${j})">
            💾
          </button>

          <button onclick="removeDuration(${i},${j})">
            🗑️
          </button>

        </div>
      `).join("")}

      <button onclick="addDuration(${i})">
        ➕ Add Duration
      </button>

    </div>

  `).join("");
}

function savePrice(productIndex,priceIndex){

  const value = Number(
    document.getElementById(
      `price-${productIndex}-${priceIndex}`
    ).value
  );

  if(!value || value < 1){
    alert("❌ Invalid price");
    return;
  }

  products[productIndex].prices[priceIndex][1] = value;

  alert("✅ Price updated");
}

function removeDuration(productIndex,priceIndex){

  products[productIndex].prices.splice(priceIndex,1);

  renderPrices();
}

function addDuration(productIndex){

  const duration = prompt(
    "Duration enter karo (example: 15 Days)"
  );

  if(!duration) return;

  const price = Number(
    prompt("Price ₹ enter karo")
  );

  if(!price || price < 1) return;

  products[productIndex].prices.push([
    duration,
    price
  ]);

  renderPrices();
}
