/* ================= STORAGE ================= */

function getUsers(){

  try{
    return JSON.parse(

    );
  }catch(e){
    return [];
  }

}

function saveUsers(users){

  localStorage.setItem(
    "m4c_users",
    JSON.stringify(users)
  );

}

function getOrders(){

      localStorage.getItem("m4c_orders") || "[]"

  }catch(e){

/* ================= TOAST ================= */

function toast(message){

  const box =
    document.getElementById("toast");

  box.textContent = message;
  box.style.display = "block";

  clearTimeout(window.toastTimer);

  window.toastTimer =
    setTimeout(()=>{
      box.style.display = "none";
    },2500);

}


/* ================= AUTH ================= */

function showAuth(type){

  document
    .getElementById("loginForm")
    .classList.toggle(
      "hidden",
      type !== "login"
    );

  document
    .getElementById("signupForm")
    .classList.toggle(
      "hidden",
      type !== "signup"
    );

  document
    .getElementById("adminLoginForm")
    .classList.add("hidden");

  document
    .getElementById("loginTab")
    .classList.toggle(
      "active",
      type === "login"
    );

  document
    .getElementById("signupTab")
    .classList.toggle(
      "active",
      type === "signup"
    );

}


function showAdminLogin(){

  document
    .getElementById("loginForm")
    .classList.add("hidden");

  document
    .getElementById("signupForm")
    .classList.add("hidden");

  document
    .getElementById("adminLoginForm")
    .classList.remove("hidden");

}


function backToLogin(){

  showAuth("login");

}


/* ================= CREATE ACCOUNT ================= */

function createAccount(){

  const username =
    document.getElementById("signupUsername")
      .value.trim();

  const email =
    document.getElementById("signupEmail")
      .value.trim()
      .toLowerCase();

  const password =
    document.getElementById("signupPassword")
      .value;

  const confirm =
    document.getElementById("signupConfirm")
      .value;


  if(!username || !email || !password){

    toast("Please fill all fields");
    return;

  }

  if(password !== confirm){

    toast("Passwords do not match");
    return;

  }

  const users = getUsers();

  const exists = users.some(
    u =>
      u.username.toLowerCase() ===
      username.toLowerCase()
      ||
      u.email.toLowerCase() === email
  );

  if(exists){

    toast("Username or email already exists");
    return;

  }

  users.push({

    id:Date.now(),

    username:username,

    email:email,

    password:password,

    balance:0,

    createdAt:new Date().toISOString()

  });

  saveUsers(users);

  document.getElementById("loginIdentity")
    .value = username;

  document.getElementById("loginPassword")
    .value = "";

  showAuth("login");

  toast("Account created successfully ✅");

}


/* ================= LOGIN ================= */

function loginUser(){

  const identity =
    document.getElementById("loginIdentity")
      .value.trim().toLowerCase();

  const password =
    document.getElementById("loginPassword")
      .value;

  const users = getUsers();

  const user = users.find(
    u =>
      (
        u.username.toLowerCase() === identity
        ||
        u.email.toLowerCase() === identity
      )
      &&
      u.password === password
  );

  if(!user){

    toast("Invalid username/email or password");
    return;

  }

  currentUser = user.username;

  localStorage.setItem(
    "m4c_current_user",
    currentUser
  );

  openCustomerApp();

  toast("Welcome back 👋");

}

/* ================= CURRENT USER ================= */

function getCurrentUser(){

  const users = getUsers();

  return users.find(

  );

/* ================= CUSTOMER APP ================= */

  closeDrawer();

  showAuth("login");

  toast("Logged out");

}


/* ================= CUSTOMER STATS ================= */

function updateCustomerStats(){

  const user = getCurrentUser();

  document
    .getElementById("walletBalance")
    .textContent =
      Number(user?.balance || 0).toFixed(2);

  const orders =
    getOrders().filter(
      o => o.username === currentUser
    );

  document
    .getElementById("orderCount")
    .textContent =
      orders.length;

}


/* ================= ESCAPE ================= */

function escapeHTML(value){

  return String(value)

    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* ================= PRODUCTS ================= */

function renderProducts(search=""){

  const grid =
    document.getElementById("productGrid");

  if(!grid) return;

  const query =
    search.trim().toLowerCase();

  const filtered =
    products.filter(p =>
      p.name.toLowerCase().includes(query)
      ||
      p.platform.toLowerCase().includes(query)
    );

  document
    .getElementById("productCount")
    .textContent =
      `${filtered.length} Products`;

  grid.innerHTML =
    filtered.map(p => `

      <div class="product">

        <div class="product-top">

          <div class="product-icon">
            ${p.icon}
          </div>

          <div>

            <div class="product-name">
              ${escapeHTML(p.name)}
            </div>

            <div class="platform">
              ${escapeHTML(p.platform)}
            </div>

          </div>

        </div>

        <div class="product-bottom">

          <span class="available">
            ${p.enabled ? "● Available" : "● Disabled"}
          </span>

          <button
            class="buy"
            ${p.enabled ? "" : "disabled"}
            onclick="openBuyModal(${p.id})"
          >
            ${p.enabled ? "Buy Now" : "Disabled"}
          </button>

        </div>

      </div>

    `).join("");

}


/* ================= BUY MODAL ================= */

function openBuyModal(id){

  const product =
    products.find(p => p.id === id);

  if(!product || !product.enabled){

    toast("Product unavailable");
    return;

  }

  selectedProduct = product;

  document
    .getElementById("buyProductName")
    .textContent =
      product.name;

  const list =
    document.getElementById("durationList");

  list.innerHTML =
    product.durations.map(
      (d,i)=>`

        <button
          class="duration"
          onclick="buyProduct(${i})"
        >

          <span>
            ${escapeHTML(d[0])}
          </span>

          <b>
            ₹${Number(d[1]).toFixed(2)}
          </b>

        </button>

      `
    ).join("");

  document
    .getElementById("buyModal")
    .classList.remove("hidden");

}


function closeBuyModal(){

  document
    .getElementById("buyModal")
    .classList.add("hidden");

  selectedProduct = null;

}


/* ================= BUY ================= */

function buyProduct(index){

  if(!selectedProduct){

    toast("Product not selected");
    return;

  }

  const user = getCurrentUser();

  if(!user){

    toast("Please login first");
    return;

  }

  const duration =
    selectedProduct.durations[index];

  const price =
    Number(duration[1]);

  const balance =
    Number(user.balance || 0);


  if(balance < price){

    toast(
      `Insufficient balance • Need ₹${(price-balance).toFixed(2)} more`
    );

    return;

  }


  user.balance =
    balance - price;

  const users = getUsers();

  const userIndex =
    users.findIndex(
      u => u.username === currentUser
    );

  if(userIndex !== -1){

    users[userIndex] = user;

    saveUsers(users);

  }


  const orders = getOrders();

  orders.unshift({

    id:
      "M4C-" +
      Date.now()
        .toString()
        .slice(-8),

    username:
      currentUser,

    productId:
      selectedProduct.id,

    product:
      selectedProduct.name,

    duration:
      duration[0],

    price:
      price,

    status:
      "Processing",

    createdAt:
      new Date().toISOString()

  });

  saveOrders(orders);

  closeBuyModal();

  updateCustomerStats();

  toast("Order placed successfully 📦");

}

/* ================= ANNOUNCEMENT ================= */

function saveAnnouncement(){

  const value =
    document
      .getElementById("announcementInput")
      .value
      .trim();

  localStorage.setItem(
    "m4c_announcement",
    value
  );

  toast("Announcement saved 📢");

}


/* ================= MAINTENANCE ================= */

function toggleMaintenance(){

  const current =
    localStorage.getItem("m4c_maintenance")
    === "true";

  localStorage.setItem(
    "m4c_maintenance",
    String(!current)
  );

  updateMaintenanceStatus();

  toast(
    !current
    ? "Maintenance enabled 🔧"
    : "Maintenance disabled ✅"
  );

}


function updateMaintenanceStatus(){

  const el =
    document.getElementById(
      "maintenanceStatus"
    );

  if(!el) return;

  const active =
    localStorage.getItem(
      "m4c_maintenance"
    ) === "true";

  el.textContent =
    active
    ? "🔴 Maintenance is ON"
    : "🟢 Store is LIVE";

  el.style.color =
    active ? "#ff5275" : "#38e58c";

}


/* ================= OPEN STORE ================= */

function openStore(){

  document
    .getElementById("adminPage")
    .classList.add("hidden");

  if(currentUser){

    document
      .getElementById("appPage")
      .classList.remove("hidden");

    updateCustomerStats();
    renderProducts();

  }else{

    document
      .getElementById("authPage")
      .classList.remove("hidden");

  }

}
